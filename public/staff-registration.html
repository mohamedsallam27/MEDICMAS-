<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDICMAS — تسجيل الكوادر الطبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1830;
    --navy:#0f2044;
    --navy-mid:#16305e;
    --gold:#c9a24d;
    --gold-soft:#e2c883;
    --gold-dim:#8a7332;
    --ivory:#f3efe4;
    --ivory-dim:#c9c4b6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse 900px 600px at 50% 0%, var(--navy-mid), var(--navy-deep));
    font-family:'Tajawal',sans-serif;
    color:var(--ivory);
    min-height:100vh;
    padding:20px;
  }
  .container{ max-width:600px; margin:0 auto; }
  .header{ display:flex; justify-content:space-between; align-items:center; padding:20px 0; }
  .logo{ font-family:'Cormorant Garamond',serif; font-size:28px; font-weight:600; color:var(--gold-soft); }
  .logo span{ color:var(--ivory); }
  .back{ color:var(--gold-dim); text-decoration:none; font-size:22px; }
  h1{ font-size:30px; margin:20px 0 5px; color:var(--ivory); }
  .subtitle{ color:var(--gold); font-size:15px; margin-bottom:20px; direction:ltr; text-align:right; }
  .divider{ width:60px; height:2px; background:linear-gradient(to right, transparent, var(--gold), transparent); margin:20px 0; }
  .field{ margin-bottom:22px; }
  label{ display:flex; justify-content:space-between; font-size:15px; margin-bottom:8px; color:#e8e8e8; }
  label .en{ color:var(--gold-dim); font-size:13px; direction:ltr; }
  input, select{
    width:100%; padding:14px 16px;
    background: rgba(255,255,255,0.04);
    border:1px solid rgba(212,175,55,0.4);
    border-radius:10px;
    color:#fff; font-size:16px;
    font-family:'Tajawal',sans-serif;
  }
  input[type="file"]{
    padding:10px;
    font-size:14px;
    color:var(--ivory-dim);
  }
  input::placeholder{ color:rgba(255,255,255,0.35); }
  input:focus, select:focus{ outline:none; border-color:var(--gold); }
  select option{ background:var(--navy); color:#fff; }
  .checkbox-field{ display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .checkbox-field input{ width:auto; }
  .section-title{ font-size:17px; color:var(--gold-soft); margin:30px 0 15px; padding-bottom:8px; border-bottom:1px solid rgba(212,175,55,0.25); }
  .hint{ font-size:12px; color:var(--ivory-dim); margin-top:6px; }
  button.submit-btn{
    width:100%; padding:16px;
    background:var(--gold); color:var(--navy-deep);
    border:none; border-radius:10px;
    font-size:18px; font-weight:700;
    cursor:pointer; margin-top:10px;
    font-family:'Tajawal',sans-serif;
  }
  button.submit-btn:disabled{ opacity:0.6; }
  .msg{ margin-top:15px; text-align:center; font-size:15px; min-height:20px; }
  .msg.success{ color:#4ade80; }
  .msg.error{ color:#f87171; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">MEDIC<span>MAS</span></div>
    <a href="index.html" class="back">‹</a>
  </div>

  <h1>تسجيل الكوادر الطبية</h1>
  <div class="subtitle">Medical Staff Registration</div>
  <div class="divider"></div>

  <form id="staffForm">
    <div class="field">
      <label><span>الاسم رباعي</span><span class="en">Full Name</span></label>
      <input type="text" id="fullName" placeholder="الاسم الأول والثاني والثالث والرابع" required>
    </div>

    <div class="field">
      <label><span>عدد سنين الخبرة</span><span class="en">Years of Experience</span></label>
      <input type="number" id="experience" placeholder="مثال: 5" required min="0">
    </div>

    <div class="field">
      <label><span>السن</span><span class="en">Age</span></label>
      <input type="number" id="age" placeholder="مثال: 29" required min="18">
    </div>

    <div class="field">
      <label><span>القسم / التخصص</span><span class="en">Specialty</span></label>
      <select id="specialty" required>
        <option value="" disabled selected>اختر التخصص</option>
        <optgroup label="التمريض — Nursing">
          <option>تمريض عام</option>
          <option>تمريض عناية مركزة (ICU)</option>
          <option>تمريض طوارئ (ER)</option>
          <option>تمريض غرف عمليات</option>
          <option>تمريض تخدير</option>
          <option>تمريض أطفال</option>
          <option>تمريض حديثي الولادة (NICU)</option>
          <option>تمريض نساء وتوليد</option>
          <option>تمريض باطنة</option>
          <option>تمريض جراحة</option>
          <option>تمريض قلب</option>
          <option>تمريض كلى وغسيل كلوي</option>
          <option>تمريض أورام</option>
        </optgroup>
        <optgroup label="الأطباء — Doctors">
          <option>طبيب عام</option>
          <option>طبيب باطنة</option>
          <option>طبيب جراحة</option>
          <option>طبيب أطفال</option>
          <option>طبيب نساء وتوليد</option>
          <option>طبيب طوارئ</option>
          <option>طبيب عناية مركزة</option>
          <option>طبيب تخدير</option>
          <option>طبيب قلب</option>
          <option>أخرى</option>
        </optgroup>
      </select>
    </div>

    <div class="field">
      <label><span>البريد الإلكتروني</span><span class="en">Email (Gmail)</span></label>
      <input type="email" id="email" placeholder="example@gmail.com" required>
    </div>

    <div class="field">
      <label><span>رقم الهاتف / واتساب</span><span class="en">Phone / WhatsApp</span></label>
      <input type="tel" id="phone" placeholder="01xxxxxxxxx" required>
    </div>

    <div class="field">
      <label><span>محل الإقامة</span><span class="en">Place of Residence</span></label>
      <input type="text" id="residence" placeholder="المدينة / المحافظة" required>
    </div>

    <div class="field">
      <label><span>نوع الدوام</span><span class="en">Availability</span></label>
      <select id="availability" required>
        <option value="" disabled selected>اختر نوع الدوام</option>
        <option value="full">دوام كامل</option>
        <option value="part">دوام جزئي</option>
      </select>
    </div>

    <div class="field">
      <label><span>الحالة الدراسية</span><span class="en">Academic Status</span></label>
      <select id="academicStatus" required>
        <option value="" disabled selected>اختر الحالة الدراسية</option>
        <option value="grad_institute">خريج معهد</option>
        <option value="grad_college">خريج كلية</option>
        <option value="student_institute">طالب معهد</option>
        <option value="intern_institute">امتياز معهد</option>
        <option value="student_college">طالب كلية</option>
        <option value="intern_college">امتياز كلية</option>
      </select>
    </div>

    <div class="field" id="gradYearField" style="display:none;">
      <label><span>سنة التخرج</span><span class="en">Graduation Year</span></label>
      <input type="number" id="graduationYear" placeholder="مثال: 2022" min="1970">
    </div>

    <div class="field" id="workplaceField" style="display:none;">
      <label><span>مكان العمل الحكومي</span><span class="en">Government Workplace</span></label>
      <input type="text" id="governmentWorkplace" placeholder="اسم المستشفى / الجهة الحكومية">
    </div>

    <div class="checkbox-field">
      <input type="checkbox" id="license">
      <label style="margin:0;">لدي ترخيص مزاولة مهنة <span class="en">I hold a practice license</span></label>
    </div>

    <div class="section-title">المستندات المطلوبة — Required Documents</div>

    <div class="field">
      <label><span>صورة البطاقة الشخصية (وش)</span><span class="en">ID Card — Front</span></label>
      <input type="file" id="idCardFront" accept="image/*" required>
    </div>

    <div class="field">
      <label><span>صورة البطاقة الشخصية (ضهر)</span><span class="en">ID Card — Back</span></label>
      <input type="file" id="idCardBack" accept="image/*" required>
    </div>

    <div class="field" id="internshipField" style="display:none;">
      <label><span>صورة إفادة الامتياز</span><span class="en">Internship Certificate</span></label>
      <input type="file" id="internshipCertificate" accept="image/*">
    </div>

    <div class="field" id="licenseCardField" style="display:none;">
      <label><span>صورة كارنيه مزاولة المهنة</span><span class="en">Practice License Card</span></label>
      <input type="file" id="licenseCard" accept="image/*">
    </div>

    <div class="field">
      <label><span>صورة شهادة الخبرة (إن وجدت)</span><span class="en">Experience Certificate (optional)</span></label>
      <input type="file" id="experienceCertificate" accept="image/*">
      <div class="hint">اختياري — ارفعها فقط لو اشتغلت قبل كدا</div>
    </div>

    <div class="field">
      <label><span>صورة شخصية</span><span class="en">Personal Photo</span></label>
      <input type="file" id="personalPhoto" accept="image/*" required>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">تسجيل / Submit</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

<script>
  var academicStatusEl = document.getElementById('academicStatus');
  var gradYearField = document.getElementById('gradYearField');
  var gradYearInput = document.getElementById('graduationYear');
  var workplaceField = document.getElementById('workplaceField');
  var internshipField = document.getElementById('internshipField');
  var licenseCardField = document.getElementById('licenseCardField');

  academicStatusEl.addEventListener('change', function() {
    var val = academicStatusEl.value;
    var isGrad = (val === 'grad_institute' || val === 'grad_college');
    var isIntern = (val === 'intern_institute' || val === 'intern_college');

    gradYearField.style.display = isGrad ? 'block' : 'none';
    gradYearInput.required = isGrad;
    if (!isGrad) gradYearInput.value = '';

    workplaceField.style.display = isGrad ? 'block' : 'none';
    document.getElementById('governmentWorkplace').required = isGrad;
    if (!isGrad) document.getElementById('governmentWorkplace').value = '';

    internshipField.style.display = isIntern ? 'block' : 'none';
    document.getElementById('internshipCertificate').required = isIntern;
    if (!isIntern) document.getElementById('internshipCertificate').value = '';

    licenseCardField.style.display = isGrad ? 'block' : 'none';
    document.getElementById('licenseCard').required = isGrad;
    if (!isGrad) document.getElementById('licenseCard').value = '';
  });

  document.getElementById('staffForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    e.stopPropagation();

    var btn = document.getElementById('submitBtn');
    var msg = document.getElementById('msg');
    msg.textContent = '';
    msg.className = 'msg';

    var formData = new FormData();
    formData.append('fullName', document.getElementById('fullName').value);
    formData.append('yearsExperience', document.getElementById('experience').value);
    formData.append('age', document.getElementById('age').value);
    formData.append('specialty', document.getElementById('specialty').value);
    formData.append('gmail', document.getElementById('email').value);
    formData.append('phone', document.getElementById('phone').value);
    formData.append('residence', document.getElementById('residence').value);
    formData.append('availability', document.getElementById('availability').value);
    formData.append('hasLicense', document.getElementById('license').checked);
    formData.append('academicStatus', academicStatusEl.value);
    if (gradYearInput.value) formData.append('graduationYear', gradYearInput.value);
    var workplaceVal = document.getElementById('governmentWorkplace').value;
    if (workplaceVal) formData.append('governmentWorkplace', workplaceVal);

    var fileFields = ['idCardFront', 'idCardBack', 'internshipCertificate', 'licenseCard', 'experienceCertificate', 'personalPhoto'];
    fileFields.forEach(function(fieldId) {
      var fileInput = document.getElementById(fieldId);
      if (fileInput.files && fileInput.files[0]) {
        formData.append(fieldId, fileInput.files[0]);
      }
    });

    btn.disabled = true;
    btn.textContent = 'جاري الإرسال...';

    try {
      var res = await fetch('/api/staff', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        msg.textContent = 'تم التسجيل بنجاح، طلبك الآن في انتظار مراجعة المسؤولين عن التطبيق على الأوراق المقدمة';
        msg.className = 'msg success';
        document.getElementById('staffForm').reset();
        gradYearField.style.display = 'none';
        workplaceField.style.display = 'none';
        internshipField.style.display = 'none';
        licenseCardField.style.display = 'none';
      } else {
        var errText = 'حدث خطأ (كود ' + res.status + ')';
        try {
          var errJson = await res.json();
          if (errJson && errJson.message) errText = errJson.message;
        } catch (parseErr) {}
        msg.textContent = errText;
        msg.className = 'msg error';
      }
    } catch (err) {
      msg.textContent = 'تعذر الاتصال بالخادم: ' + err.message;
      msg.className = 'msg error';
    }

    btn.disabled = false;
    btn.textContent = 'تسجيل / Submit';

    return false;
  });
</script>
</body>
</html>
