<html lang="ar" dir="rtl">

<title>MEDICMAS</title>

<style>
  :root{
    --navy-deep:#0a1830;
    --navy:#0f2044;
    --navy-mid:#16305e;
    --gold:#c9a24d;
    --gold-soft:#e2c883;
    --gold-dim:#8a7332;
    --ivory:#f3efe4;
    --ivory-dim:#c9c4b6;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:

    font-family:'Tajawal',sans-serif;
    color:var(--ivory);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow-x:hidden;
    position:relative;
  }

  .motif{
    position:absolute;
    top:-60px;
    left:50%;
    transform:translateX(-50%);
    width:520px;
    height:520px;
    opacity:0.07;
    pointer-events:none;
  }

  .wrap{
    width:100%;
    max-width:480px;
    padding:56px 28px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
    z-index:1;
  }

  .wordmark{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:44px;
    letter-spacing:2px;
    color:var(--gold-soft);
    direction:ltr;
    text-align:center;
  }

  .wordmark span{ color:var(--ivory); font-weight:500; }

  .rule{
    width:64px;
    height:1px;
    background:linear-gradient(to right, transparent, var(--gold), transparent);
    margin:18px 0 16px;
  }

  .tagline-ar{
    font-size:17px;
    font-weight:500;
    color:var(--ivory);
    text-align:center;
    line-height:1.7;
  }

  .tagline-en{
    font-size:12.5px;
    font-weight:400;
    color:var(--gold-dim);
    direction:ltr;
    text-align:center;
    letter-spacing:0.5px;
    margin-top:6px;
  }
