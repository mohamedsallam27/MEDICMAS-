<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MEDICMAS — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1830; --navy:#0f2044; --navy-mid:#16305e;
    --gold:#c9a24d; --gold-soft:#e2c883; --gold-dim:#8a7332;
    --ivory:#f3efe4; --ivory-dim:#c9c4b6;
    --field-bg:rgba(255,255,255,0.03); --field-border:rgba(201,162,77,0.35);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse 900px 500px at 50% -10%, var(--navy-mid) 0%, var(--navy) 45%, var(--navy-deep) 100%);
    font-family:'Tajawal',sans-serif; color:var(--ivory); min-height:100vh;
  }
  .wrap{ max-width:760px; margin:0 auto; padding:36px 20px 60px; }
  .wordmark-mini{ font-family:'Cormorant Garamond', serif; font-weight:600; font-size:20px; color:var(--gold-soft); direction:ltr; text-align:center; }
  .wordmark-mini span{ color:var(--ivory); font-weight:500; }
  .title-ar{ font-size:22px; font-weight:700; text-align:center; margin-top:10px; }
  .rule{ width:64px; height:1px; background:linear-gradient(to right, transparent, var(--gold), transparent); margin:16px auto 28px; }

  #loginBox{ max-width:340px; margin:60px auto 0; display:flex; flex-direction:column; gap:14px; }
  #loginBox input{
    background:var(--field-bg); border:1px solid var(--field-border); border-radius:5px;
    padding:13px 14px; font-size:15px; color:var(--ivory); direction:ltr; text-align:center;
  }
  #loginBox input:focus{ outline:none; border-color:var(--gold); }
  #loginBox button{
    background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--navy-deep);
    border:none; border-radius:5px; padding:13px; font-family:'Tajawal',sans-serif;
    font-size:15px; font-weight:700; cursor:pointer;
  }
  #loginError{ color:#e0876b; font-size:13px; text-align:center; min-height:16px; }

  #dashboard{ display:none; }
  .tabs{ display:flex; gap:10px; margin-bottom:22px; }
  .tab{
    flex:1; text-align:center; padding:12px; border:1px solid var(--field-border); border-radius:5px;
    cursor:pointer; font-weight:700; font-size:14px; color:var(--ivory-dim);
  }
  .tab.active{ border-color:var(--gold); color:var(--gold-soft); background:rgba(201,162,77,0.08); }

  .entry{
    border:1px solid var(--field-border); border-radius:6px; padding:16px; margin-bottom:12px;
    background:rgba(255,255,255,0.02);
  }
  .entry-row{ display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-size:13.5px; }
  .entry-row .label{ color:var(--gold-dim); flex-shrink:0; }
  .entry-row .value{ text-align:left; direction:ltr; color:var(--ivory); word-break:break-word; }
  .entry-row .value[dir="rtl-val"]{ direction:rtl; text-align:right; }
  .edit-btn{
    margin-top:8px; width:100%; background:transparent; border:1px solid var(--gold-dim); color:var(--gold-soft);
    border-radius:5px; padding:9px; font-family:'Tajawal',sans-serif; font-size:13px; cursor:pointer;
  }
  .empty-msg{ text-align:center; color:var(--ivory-dim); padding:30px 0; font-size:14px; }

  .status-badge{
    display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;
  }
  .status-badge.pending{ background:rgba(201,162,77,0.15); color:var(--gold-soft); border:1px solid var(--gold-dim); }
  .status-badge.accepted{ background:rgba(74,222,128,0.15); color:#4ade80; border:1px solid #4ade80; }
  .status-badge.rejected{ background:rgba(248,113,113,0.15); color:#f87171; border:1px solid #f87171; }

  .docs-title{ font-size:12.5px; color:var(--gold-dim); margin:12px 0 8px; }
  .docs-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px; }
  .doc-thumb{ display:block; border:1px solid var(--field-border); border-radius:6px; overflow:hidden; text-decoration:none; }
  .doc-thumb img{ width:100%; height:70px; object-fit:cover; display:block; }
  .doc-thumb .doc-label{ font-size:10px; color:var(--ivory-dim); text-align:center; padding:3px 2px; background:rgba(0,0,0,0.2); }
  .no-doc{ font-size:12px; color:var(--ivory-dim); }

  .action-row{ display:flex; gap:8px; margin-top:10px; }
  .accept-btn, .reject-btn{
    flex:1; border:none; border-radius:5px; padding:10px; font-family:'Tajawal',sans-serif;
    font-size:13px; font-weight:700; cursor:pointer;
  }
  .accept-btn{ background:linear-gradient(180deg, #6ee7a3, #4ade80); color:var(--navy-deep); }
  .reject-btn{ background:transparent; border:1px solid #f87171; color:#f87171; }
  .accept-btn:disabled, .reject-btn:disabled{ opacity:0.5; cursor:default; }

  #editOverlay{
    display:none; position:fixed; inset:0; background:rgba(10,24,48,0.9); z-index:10;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;
  }
  #editBox{
    background:var(--navy); border:1px solid var(--field-border); border-radius:8px; padding:22px;
    max-width:420px; width:100%; display:flex; flex-direction:column; gap:12px;
  }
  #editBox label{ font-size:12.5px; color:var(--ivory-dim); }
  #editBox input, #editBox select, #editBox textarea{
    width:100%; background:var(--field-bg); border:1px solid var(--field-border); border-radius:5px;
    padding:10px 12px; color:var(--ivory); font-family:'Tajawal',sans-serif; font-size:14px; margin-top:4px;
  }
  #editBox .btn-row{ display:flex; gap:10px; margin-top:8px; }
  #editBox .save-btn{
    flex:1; background:linear-gradient(180deg, var(--gold-soft), var(--gold)); color:var(--navy-deep);
    border:none; border-radius:5px; padding:12px; font-weight:700; cursor:pointer;
  }
  #editBox .cancel-btn{
    flex:1; background:transparent; border:1px solid var(--field-border); color:var(--ivory-dim);
    border-radius:5px; padding:12px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark-mini">MEDIC<span>MAS</span></div>
  <div class="title-ar">لوحة التحكم</div>
  <div class="rule"></div>

  <div id="loginBox">
    <input type="password" id="passwordInput" placeholder="كلمة السر">
    <button id="loginBtn">دخول</button>
    <div id="loginError"></div>
  </div>

  <div id="dashboard">
    <div class="tabs">
      <div class="tab active" data-tab="staff">الكوادر الطبية</div>
      <div class="tab" data-tab="hospital">المستشفيات</div>
    </div>
    <div id="listContainer"></div>
  </div>
</div>

<div id="editOverlay">
  <div id="editBox"></div>
</div>

<script>
  let adminPassword = '';
  let currentTab = 'staff';
  let staffData = [];
  let hospitalData = [];

  const specialties = [
    "تمريض عام","تمريض عناية مركزة (ICU)","تمريض طوارئ (ER)","تمريض غرف عمليات","تمريض تخدير",
    "تمريض أطفال","تمريض حديثي الولادة (NICU)","تمريض نساء وتوليد","تمريض باطنة","تمريض جراحة",
    "تمريض قلب","تمريض كلى وغسيل كلوي","تمريض أورام","تمريض نفسي","تمريض مجتمعي","إشراف تمريضي (سوبرفايزر)",
    "طب عام / ممارس عام","باطنة عامة","جراحة عامة","أطفال","نساء وتوليد","رمد (عيون)","أنف وأذن وحنجرة",
    "جلدية","مسالك بولية","عظام","مخ وأعصاب","جراحة مخ وأعصاب","قلب وأوعية دموية","جراحة قلب وصدر",
    "صدر","كلى","غدد صماء وسكر","روماتيزم ومناعة","أورام","أشعة","تحاليل طبية","باثولوجي",
    "تخدير ورعاية مركزة","طوارئ","تغذية علاجية","طب نفسي","طب أسرة","حروق وتجميل","جراحة أطفال",
    "حساسية ومناعة","أمراض معدية","طب أسنان عام","تقويم أسنان","جراحة فم وأسنان","لبية (عصب)",
    "تركيبات أسنان","صيدلة","علاج طبيعي","فني أشعة","فني تحاليل / مختبرات","فني غسيل كلوي",
    "فني تخدير","فني طوارئ / إسعاف","أخصائي تغذية","أخصائي نفسي","أخصائي تخاطب","إدارة مستشفيات"
  ];
  const qualifications = ["طالب","فني","أخصائي","ماجيستير","دكتوراه","زمالة","استشاري"];

  const academicStatusLabels = {
    grad_institute: "خريج معهد",
    grad_college: "خريج كلية",
    student_institute: "طالب معهد",
    intern_institute: "امتياز معهد",
    student_college: "طالب كلية",
    intern_college: "امتياز كلية"
  };

  const statusLabels = {
    pending: "قيد المراجعة",
    accepted: "مقبول",
    rejected: "مرفوض"
  };

  const docLabels = {
    idCardFront: "البطاقة (وش)",
    idCardBack: "البطاقة (ضهر)",
    internshipCertificate: "إفادة الامتياز",
    licenseCard: "كارنيه المزاولة",
    experienceCertificate: "شهادة الخبرة",
    personalPhoto: "صورة شخصية"
  };

  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('passwordInput').addEventListener('keydown', e => { if(e.key === 'Enter') login(); });

  async function login(){
    const pass = document.getElementById('passwordInput').value;
    try{
      const res = await fetch('/api/admin/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ password: pass })
      });
      if(!res.ok) throw new Error();
      adminPassword = pass;
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadAll();
    }catch(err){
      document.getElementById('loginError').textContent = 'كلمة السر غير صحيحة';
    }
  }

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      render();
    });
  });

  async function loadAll(){
    const [s, h] = await Promise.all([
      fetch('/api/staff', { headers:{'x-admin-password': adminPassword} }).then(r=>r.json()),
      fetch('/api/hospital', { headers:{'x-admin-password': adminPassword} }).then(r=>r.json())
    ]);
    staffData = s; hospitalData = h;
    render();
  }

  function render(){
    const container = document.getElementById('listContainer');
    container.innerHTML = '';
    const data = currentTab === 'staff' ? staffData : hospitalData;

    if(!data.length){
      container.innerHTML = '<div class="empty-msg">لا يوجد تسجيلات حتى الآن</div>';
      return;
    }

    data.forEach(item=>{
      const el = document.createElement('div');
      el.className = 'entry';
      if(currentTab === 'staff'){
        const academicLabel = academicStatusLabels[item.academicStatus] || '—';
        const isGrad = (item.academicStatus === 'grad_institute' || item.academicStatus === 'grad_college');
        const status = item.status || 'pending';
        const docs = item.documents || {};

        let docsHtml = '<div class="docs-title">المستندات المرفوعة</div><div class="docs-grid">';
        let hasAnyDoc = false;
        Object.keys(docLabels).forEach(key=>{
          if(docs[key]){
            hasAnyDoc = true;
            docsHtml += `
              <a class="doc-thumb" href="${docs[key]}" target="_blank" rel="noopener">
                <img src="${docs[key]}" alt="${docLabels[key]}">
                <div class="doc-label">${docLabels[key]}</div>
              </a>`;
          }
        });
        docsHtml += '</div>';
        if(!hasAnyDoc) docsHtml = '<div class="no-doc">لم يتم رفع أي مستندات</div>';

        el.innerHTML = `
          <div class="entry-row"><span class="label">الحالة</span><span class="status-badge ${status}">${statusLabels[status]}</span></div>
          <div class="entry-row"><span class="label">الاسم</span><span class="value" dir="rtl-val">${item.fullName}</span></div>
          <div class="entry-row"><span class="label">التخصص</span><span class="value" dir="rtl-val">${item.specialty}</span></div>
          <div class="entry-row"><span class="label">الخبرة</span><span class="value">${item.yearsExperience} سنوات</span></div>
          <div class="entry-row"><span class="label">السن</span><span class="value">${item.age}</span></div>
          <div class="entry-row"><span class="label">الهاتف</span><span class="value">${item.phone}</span></div>
          <div class="entry-row"><span class="label">Gmail</span><span class="value">${item.gmail}</span></div>
          <div class="entry-row"><span class="label">الإقامة</span><span class="value" dir="rtl-val">${item.residence}</span></div>
          <div class="entry-row"><span class="label">الدوام</span><span class="value" dir="rtl-val">${item.availability === 'full' ? 'كامل' : 'جزئي'}</span></div>
          <div class="entry-row"><span class="label">الحالة الدراسية</span><span class="value" dir="rtl-val">${academicLabel}</span></div>
          ${isGrad ? `<div class="entry-row"><span class="label">سنة التخرج</span><span class="value">${item.graduationYear || '—'}</span></div>` : ''}
          ${isGrad ? `<div class="entry-row"><span class="label">مكان العمل الحكومي</span><span class="value" dir="rtl-val">${item.governmentWorkplace || '—'}</span></div>` : ''}
          ${docsHtml}
        `;

        const actionRow = document.createElement('div');
        actionRow.className = 'action-row';
        const acceptBtn = document.createElement('button');
        acceptBtn.className = 'accept-btn';
        acceptBtn.textContent = 'قبول';
        acceptBtn.disabled = (status === 'accepted');
        acceptBtn.addEventListener('click', ()=> updateStatus(item, 'accepted'));
        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'reject-btn';
        rejectBtn.textContent = 'رفض';
        rejectBtn.disabled = (status === 'rejected');
        rejectBtn.addEventListener('click', ()=> updateStatus(item, 'rejected'));
        actionRow.appendChild(acceptBtn);
        actionRow.appendChild(rejectBtn);
        el.appendChild(actionRow);
      } else {
        el.innerHTML = `
          <div class="entry-row"><span class="label">المستشفى</span><span class="value" dir="rtl-val">${item.hospitalName}</span></div>
          <div class="entry-row"><span class="label">البريد الإلكتروني</span><span class="value">${item.email || '—'}</span></div>
          <div class="entry-row"><span class="label">الهاتف</span><span class="value">${item.phone || '—'}</span></div>
          <div class="entry-row"><span class="label">الموقع</span><span class="value" dir="rtl-val">${item.location || '—'}</span></div>
          <div class="entry-row"><span class="label">التخصص المطلوب</span><span class="value" dir="rtl-val">${item.specialtyNeeded}</span></div>
          <div class="entry-row"><span class="label">العرض المالي</span><span class="value" dir="rtl-val">${item.financialOffer}</span></div>
          <div class="entry-row"><span class="label">الامتيازات</span><span class="value" dir="rtl-val">${item.benefits || '—'}</span></div>
          <div class="entry-row"><span class="label">المؤهل</span><span class="value" dir="rtl-val">${item.qualification}</span></div>
          <div class="entry-row"><span class="label">اسم المسجّل</span><span class="value" dir="rtl-val">${item.contactName || '—'}</span></div>
          <div class="entry-row"><span class="label">وظيفته</span><span class="value" dir="rtl-val">${item.contactJobTitle || '—'}</span></div>
          <div class="entry-row"><span class="label">رقم تواصل المسجّل</span><span class="value">${item.contactPhone || '—'}</span></div>
        `;
      }
      const btn = document.createElement('button');
      btn.className = 'edit-btn';
      btn.textContent = 'تعديل';
      btn.addEventListener('click', ()=> openEdit(item));
      el.appendChild(btn);
      container.appendChild(el);
    });
  }

  async function updateStatus(item, newStatus){
    try{
      const res = await fetch(`/api/staff/${item._id}`, {
        method:'PUT',
        headers:{'Content-Type':'application/json', 'x-admin-password': adminPassword},
        body: JSON.stringify({ status: newStatus })
      });
      if(!res.ok) throw new Error();
      loadAll();
    }catch(err){
      alert('حدث خطأ أثناء تحديث الحالة');
    }
  }

  function openEdit(item){
    const box = document.getElementById('editBox');
    if(currentTab === 'staff'){
      const isGrad = (item.academicStatus === 'grad_institute' || item.academicStatus === 'grad_college');
      box.innerHTML = `
        <label>الاسم رباعي<input id="e_fullName" value="${item.fullName}"></label>
        <label>عدد سنين الخبرة<input id="e_yearsExperience" type="number" value="${item.yearsExperience}"></label>
        <label>السن<input id="e_age" type="number" value="${item.age}"></label>
        <label>التخصص<select id="e_specialty">${specialties.map(s=>`<option ${s===item.specialty?'selected':''}>${s}</option>`).join('')}</select></label>
        <label>الهاتف<input id="e_phone" value="${item.phone}"></label>
        <label>Gmail<input id="e_gmail" value="${item.gmail}"></label>
        <label>الإقامة<input id="e_residence" value="${item.residence}"></label>
        <label>الدوام<select id="e_availability">
          <option value="full" ${item.availability==='full'?'selected':''}>كامل</option>
          <option value="part" ${item.availability==='part'?'selected':''}>جزئي</option>
        </select></label>
        <label>الحالة الدراسية<select id="e_academicStatus">
          <option value="grad_institute" ${item.academicStatus==='grad_institute'?'selected':''}>خريج معهد</option>
          <option value="grad_college" ${item.academicStatus==='grad_college'?'selected':''}>خريج كلية</option>
          <option value="student_institute" ${item.academicStatus==='student_institute'?'selected':''}>طالب معهد</option>
          <option value="intern_institute" ${item.academicStatus==='intern_institute'?'selected':''}>امتياز معهد</option>
          <option value="student_college" ${item.academicStatus==='student_college'?'selected':''}>طالب كلية</option>
          <option value="intern_college" ${item.academicStatus==='intern_college'?'selected':''}>امتياز كلية</option>
        </select></label>
        <label id="e_gradYearLabel" style="display:${isGrad ? 'block' : 'none'};">سنة التخرج<input id="e_graduationYear" type="number" value="${item.graduationYear || ''}"></label>
        <label id="e_workplaceLabel" style="display:${isGrad ? 'block' : 'none'};">مكان العمل الحكومي<input id="e_governmentWorkplace" value="${item.governmentWorkplace || ''}"></label>
        <label>الحالة<select id="e_status">
          <option value="pending" ${item.status==='pending' || !item.status ?'selected':''}>قيد المراجعة</option>
          <option value="accepted" ${item.status==='accepted'?'selected':''}>مقبول</option>
          <option value="rejected" ${item.status==='rejected'?'selected':''}>مرفوض</option>
        </select></label>
        <div class="btn-row">
          <button class="save-btn" id="saveBtn">حفظ</button>
          <button class="cancel-btn" id="cancelBtn">إلغاء</button>
        </div>
      `;
      document.getElementById('e_academicStatus').addEventListener('change', function(){
        const grad = (this.value === 'grad_institute' || this.value === 'grad_college');
        document.getElementById('e_gradYearLabel').style.display = grad ? 'block' : 'none';
        document.getElementById('e_workplaceLabel').style.display = grad ? 'block' : 'none';
      });
    } else {
      box.innerHTML = `
        <label>اسم المستشفى<input id="e_hospitalName" value="${item.hospitalName}"></label>
        <label>البريد الإلكتروني<input id="e_email" value="${item.email || ''}"></label>
        <label>الهاتف<input id="e_phone" value="${item.phone || ''}"></label>
        <label>الموقع<input id="e_location" value="${item.location || ''}"></label>
        <label>التخصص المطلوب<select id="e_specialtyNeeded">${specialties.map(s=>`<option ${s===item.specialtyNeeded?'selected':''}>${s}</option>`).join('')}</select></label>
        <label>العرض المالي<input id="e_financialOffer" value="${item.financialOffer}"></label>
        <label>الامتيازات<textarea id="e_benefits">${item.benefits || ''}</textarea></label>
        <label>المؤهل<select id="e_qualification">${qualifications.
